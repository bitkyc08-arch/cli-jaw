name: Desktop Release

on:
  release:
    types: [published]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  desktop-release:
    name: Build ${{ matrix.platform }} desktop app
    runs-on: ${{ matrix.os }}
    concurrency:
      group: desktop-release-${{ github.event.release.tag_name || github.run_id }}-${{ matrix.platform }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos
            os: macos-latest
            script: dist:mac
            sidecar_platform: darwin
            sidecar_arch: arm64
            sidecar_check_script: check:electron-dist-mac-jwc
            artifact_globs: |
              electron/dist/*.dmg
              electron/dist/*.zip
          - platform: windows
            os: windows-latest
            script: dist:win
            sidecar_platform: win32
            sidecar_arch: x64
            sidecar_check_script: check:electron-dist-win-jwc
            artifact_globs: |
              electron/dist/*.exe
              electron/dist/*.msi
              electron/dist/*.zip
          - platform: linux
            os: ubuntu-latest
            script: dist:linux
            sidecar_platform: linux
            sidecar_arch: x64
            sidecar_check_script: check:electron-dist-linux-jwc
            artifact_globs: |
              electron/dist/*.AppImage
              electron/dist/*.deb
              electron/dist/*.rpm
              electron/dist/*.zip

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            electron/package-lock.json

      # node-gyp rebuilds the native node-pty module during packaging. The
      # bundled node-gyp still imports stdlib `distutils`, which Python 3.12+
      # removed (PEP 632). GitHub runners now default to 3.12+, so pin 3.11.
      - name: Setup Python 3.11 (node-gyp needs distutils)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install server dependencies
        # --ignore-scripts: postinstall-guard runs `bash atomic-build.sh` via cmd
        # on Windows and fails; bundle-sidecar.sh builds explicitly under bash.
        run: npm ci --ignore-scripts

      - name: Build server and bundle sidecar
        run: bash scripts/bundle-sidecar.sh "${{ matrix.sidecar_platform }}" "${{ matrix.sidecar_arch }}"

      - name: Install Electron dependencies
        run: npm ci --prefix electron

      - name: Type check Electron shell
        run: npm --prefix electron run typecheck

      - name: Build Electron shell
        run: npm --prefix electron run build

      - name: Package desktop app
        run: npm --prefix electron run ${{ matrix.script }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Verify packaged app JWC
        run: npm run ${{ matrix.sidecar_check_script }}

      - name: Verify macOS app icons
        if: matrix.platform == 'macos'
        run: |
          npm run check:app-icons

      - name: Upload build artifacts (manual run)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.platform }}
          path: |
            electron/dist/*.dmg
            electron/dist/*.exe
            electron/dist/*.msi
            electron/dist/*.AppImage
            electron/dist/*.deb
            electron/dist/*.rpm
            electron/dist/*.zip
          if-no-files-found: error
          retention-days: 7

      - name: Upload desktop assets to release
        if: github.event_name == 'release'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.event.release.tag_name }}
          ARTIFACT_GLOBS: ${{ matrix.artifact_globs }}
        run: |
          set -euo pipefail
          shopt -s nullglob

          files=()
          while IFS= read -r pattern; do
            [ -n "$pattern" ] || continue
            for file in $pattern; do
              [ -f "$file" ] && files+=("$file")
            done
          done <<< "$ARTIFACT_GLOBS"

          if [ "${#files[@]}" -eq 0 ]; then
            echo "No desktop assets found for ${{ matrix.platform }}."
            find electron/dist -maxdepth 2 -type f -print || true
            exit 1
          fi

          printf 'Uploading %s assets for %s:\n' "${#files[@]}" "${{ matrix.platform }}"
          printf ' - %s\n' "${files[@]}"
          gh release upload "$TAG_NAME" "${files[@]}" --clobber
