# ast-grep scan rule (warn-level radar): lists ALL empty catch blocks.
# Comments are not part of the AST, so annotated sites (`catch {} // best-effort: ...`)
# still match — reviewers check that each listed site carries a best-effort reason
# comment or a log.debug. New sites without one fail review.
# Usage: sg scan --rule structure/rules/no-empty-catch.yml src bin server.ts public/js
id: no-empty-catch
language: TypeScript
severity: warning
message: empty catch — verify it carries `// best-effort: <reason>` or log.debug
rule:
  pattern: 'try { $$$BODY } catch {}'
