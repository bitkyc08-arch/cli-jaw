name: Postinstall Platform Checks

on:
  push:
    branches:
      - preview
      - main
    paths:
      - '.gitattributes'
      - '.github/workflows/postinstall-platform.yml'
      - 'bin/postinstall.ts'
      - 'src/core/claude-install.ts'
      - 'src/core/cli-detect.ts'
      - 'src/core/platform-kind.ts'
      - 'src/core/runtime-path.ts'
      - 'scripts/install-risk-gate.mjs'
      - 'scripts/install.sh'
      - 'scripts/install-wsl.sh'
      - 'scripts/install-officecli.ps1'
      - 'scripts/fresh-install-smoke.ts'
      - 'scripts/verify-fresh-install.sh'
      - 'scripts/collect-fresh-install-evidence.sh'
      - 'scripts/audit-fresh-install-evidence.mjs'
      - 'scripts/verify-release-evidence.mjs'
      - 'scripts/require-release-evidence.mjs'
      - 'tests/unit/cli-detect.test.ts'
      - 'tests/unit/platform-kind.test.ts'
      - 'tests/unit/platform-kind-runtime.test.ts'
      - 'tests/unit/platform-kind-delegation.test.ts'
      - 'tests/unit/windows-native-cli-detect.test.ts'
      - 'tests/unit/doctor-platform-lanes.test.ts'
      - 'tests/unit/install-sh-exec.test.ts'
      - 'tests/unit/fresh-evidence-audit.test.ts'
      - 'tests/unit/safe-install.test.ts'
      - 'tests/unit/service.test.ts'
      - 'tests/unit/postinstall-strict-tools.test.ts'
      - 'tests/unit/wsl-installer-doctor.test.ts'
      - 'tests/unit/wsl-installer-exec.test.ts'
      - 'src/core/install-integrity.ts'
      - 'scripts/install.ps1'
      - 'scripts/postinstall-guard.cjs'
      - 'scripts/ensure-native-modules.cjs'
      - 'scripts/bundle-sidecar.sh'
      - 'bin/cli-jaw.ts'
      - 'bin/commands/init.ts'
      - 'bin/commands/doctor.ts'
      - 'Dockerfile'
      - 'Dockerfile.dev'
      - 'structure/infra.md'
      - 'tests/unit/install-integrity.test.ts'
      - 'tests/unit/scriptless-install-contract.test.ts'
      - 'package.json'
      - 'package-lock.json'
  pull_request:
    paths:
      - '.gitattributes'
      - '.github/workflows/postinstall-platform.yml'
      - 'bin/postinstall.ts'
      - 'src/core/claude-install.ts'
      - 'src/core/cli-detect.ts'
      - 'src/core/platform-kind.ts'
      - 'src/core/runtime-path.ts'
      - 'scripts/install-risk-gate.mjs'
      - 'scripts/install.sh'
      - 'scripts/install-wsl.sh'
      - 'scripts/install-officecli.ps1'
      - 'scripts/fresh-install-smoke.ts'
      - 'scripts/verify-fresh-install.sh'
      - 'scripts/collect-fresh-install-evidence.sh'
      - 'scripts/audit-fresh-install-evidence.mjs'
      - 'scripts/verify-release-evidence.mjs'
      - 'scripts/require-release-evidence.mjs'
      - 'tests/unit/cli-detect.test.ts'
      - 'tests/unit/platform-kind.test.ts'
      - 'tests/unit/platform-kind-runtime.test.ts'
      - 'tests/unit/platform-kind-delegation.test.ts'
      - 'tests/unit/windows-native-cli-detect.test.ts'
      - 'tests/unit/doctor-platform-lanes.test.ts'
      - 'tests/unit/install-sh-exec.test.ts'
      - 'tests/unit/fresh-evidence-audit.test.ts'
      - 'tests/unit/safe-install.test.ts'
      - 'tests/unit/service.test.ts'
      - 'tests/unit/postinstall-strict-tools.test.ts'
      - 'tests/unit/wsl-installer-doctor.test.ts'
      - 'tests/unit/wsl-installer-exec.test.ts'
      - 'src/core/install-integrity.ts'
      - 'scripts/install.ps1'
      - 'scripts/postinstall-guard.cjs'
      - 'scripts/ensure-native-modules.cjs'
      - 'scripts/bundle-sidecar.sh'
      - 'bin/cli-jaw.ts'
      - 'bin/commands/init.ts'
      - 'bin/commands/doctor.ts'
      - 'Dockerfile'
      - 'Dockerfile.dev'
      - 'structure/infra.md'
      - 'tests/unit/install-integrity.test.ts'
      - 'tests/unit/scriptless-install-contract.test.ts'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: postinstall-platform-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux postinstall policy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Type check
        run: npx tsc --noEmit

      - name: Run postinstall policy tests
        run: npx tsx --import ./tests/setup/test-home.ts --experimental-test-module-mocks --test tests/unit/cli-detect.test.ts tests/unit/safe-install.test.ts

      - name: Run install-integrity contract tests
        run: npx tsx --experimental-test-module-mocks tests/run.mts tests/unit/install-integrity.test.ts tests/unit/scriptless-install-contract.test.ts

      - name: Scriptless global install smoke (Linux)
        run: |
          set -euo pipefail
          npm run build
          npm pack
          TGZ="$(ls cli-jaw-*.tgz | head -n1)"
          PREFIX="$(mktemp -d)"
          npm install -g --ignore-scripts --prefix "$PREFIX" "./$TGZ"
          "$PREFIX/bin/jaw" --version
          # --version skips the native guard, so open the native addon + vec
          # extension from the installed root — that is the real scriptless proof.
          PKG_ROOT="$PREFIX/lib/node_modules/cli-jaw"
          node -e "const {createRequire}=require('module');const r=createRequire(process.argv[1]+'/package.json');const D=r('better-sqlite3');const db=new D(':memory:');const v=r('sqlite-vec');v.load(db);console.log('native+vec OK', db.prepare('select vec_version() as x').get().x);db.close()" "$PKG_ROOT"

  macos-installer-risk:
    name: macOS installer risk gate
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run installer risk gate
        run: npm run test:install-risk

      - name: Build package
        run: npm run build

      - name: Smoke packaged global install
        run: npm run test:fresh-install -- --postinstall --skip-doctor

      - name: Scriptless global install smoke (macOS)
        run: |
          set -euo pipefail
          npm pack
          TGZ="$(ls cli-jaw-*.tgz | head -n1)"
          PREFIX="$(mktemp -d)"
          npm install -g --ignore-scripts --prefix "$PREFIX" "./$TGZ"
          "$PREFIX/bin/jaw" --version
          PKG_ROOT="$PREFIX/lib/node_modules/cli-jaw"
          node -e "const {createRequire}=require('module');const r=createRequire(process.argv[1]+'/package.json');const D=r('better-sqlite3');const db=new D(':memory:');const v=r('sqlite-vec');v.load(db);console.log('native+vec OK', db.prepare('select vec_version() as x').get().x);db.close()" "$PKG_ROOT"

  windows-wsl:
    name: Windows WSL postinstall policy
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup WSL
        uses: Vampire/setup-wsl@v7
        with:
          distribution: Ubuntu-24.04
          use-cache: 'false'
          additional-packages: curl ca-certificates gnupg

      - name: Install Node.js in WSL
        shell: wsl-bash {0}
        run: |
          set -euo pipefail
          curl -fsSL https://deb.nodesource.com/setup_22.x | sudo -E bash -
          sudo apt-get install -y nodejs
          node --version
          npm --version

      - name: Install dependencies in WSL
        shell: wsl-bash {0}
        run: |
          set -euo pipefail
          cd "$(wslpath '${{ github.workspace }}')"
          npm ci --ignore-scripts

      - name: Type check in WSL
        shell: wsl-bash {0}
        run: |
          set -euo pipefail
          cd "$(wslpath '${{ github.workspace }}')"
          npx tsc --noEmit

      # Asserts the LINUX side of the boundary on a genuine WSL process. The
      # expectation is pinned rather than inferred: without JAW_EXPECT_PLATFORM_KIND
      # a scrubbed WSL_DISTRO_NAME would let the test accept plain `linux`, so a
      # resolver regression could keep this job green.
      - name: Assert real-runtime classification inside WSL
        shell: wsl-bash {0}
        env:
          JAW_EXPECT_PLATFORM_KIND: wsl
        run: |
          set -euo pipefail
          cd "$(wslpath '${{ github.workspace }}')"
          JAW_EXPECT_PLATFORM_KIND=wsl npx tsx --test tests/unit/platform-kind-runtime.test.ts

      - name: Run installer risk gate in WSL
        shell: wsl-bash {0}
        run: |
          set -euo pipefail
          cd "$(wslpath '${{ github.workspace }}')"
          npm run test:install-risk

      - name: Build package in WSL
        shell: wsl-bash {0}
        run: |
          set -euo pipefail
          cd "$(wslpath '${{ github.workspace }}')"
          npm run build

      - name: Smoke packaged global install in WSL
        shell: wsl-bash {0}
        run: |
          set -euo pipefail
          cd "$(wslpath '${{ github.workspace }}')"
          npm run test:fresh-install -- --postinstall --skip-doctor

      - name: Smoke PowerShell to WSL login shell
        shell: pwsh
        run: |
          $workspace = $env:GITHUB_WORKSPACE
          $workspaceForWsl = $workspace -replace '\\', '/'
          $linuxWorkspace = (wsl.exe -d Ubuntu-24.04 -- wslpath "$workspaceForWsl").Trim()
          if (-not $linuxWorkspace) { throw "wslpath returned an empty workspace path" }
          wsl.exe -d Ubuntu-24.04 -- bash -lc "cd '$linuxWorkspace' && npm run test:fresh-install -- --postinstall --skip-doctor"

  windows-native:
    name: Windows native install.ps1 (beta)
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Type check
        run: npx tsc --noEmit

      - name: Run platform detection tests on native Windows
        run: npx tsx --test tests/unit/platform-kind.test.ts tests/unit/platform-kind-delegation.test.ts tests/unit/windows-native-cli-detect.test.ts tests/unit/doctor-platform-lanes.test.ts

      # The injected-fixture tables above prove the same thing on every OS.
      # This one calls the resolver with NO arguments, so it is the only step
      # that proves correctness when process.platform genuinely is win32.
      - name: Assert real-runtime classification on native Windows
        env:
          JAW_EXPECT_PLATFORM_KIND: windows-native
        run: npx tsx --test tests/unit/platform-kind-runtime.test.ts

      # NOTE: tests/unit/cli-detect.test.ts is intentionally NOT run here. Its
      # fixtures depend on the POSIX executable bit (chmod), which Windows does
      # not have, so those cases are POSIX-only by construction. Real where.exe
      # discovery is covered by the win32-gated cases inside
      # windows-native-cli-detect.test.ts, which run in the step above.
      - name: Build package
        run: npm run build

      - name: Run install.ps1 against the packed tarball (isolated prefix)
        shell: pwsh
        run: |
          npm pack
          $tgz = Get-ChildItem cli-jaw-*.tgz | Select-Object -First 1
          $prefix = Join-Path $env:RUNNER_TEMP "jaw-prefix"
          # Executes the beta installer itself so its npm version gate, PATH
          # diagnosis, and error handling actually run — not just raw npm.
          pwsh -NoProfile -File scripts/install.ps1 -TarballPath $tgz.FullName -Prefix $prefix -IgnoreScripts
          & (Join-Path $prefix "jaw.cmd") --version
          # --version skips the native guard; opening the addon + vec extension
          # from the installed root is the real scriptless proof on Windows.
          $pkgRoot = Join-Path $prefix "node_modules\cli-jaw"
          node -e "const {createRequire}=require('module');const r=createRequire(process.argv[1]+'/package.json');const D=r('better-sqlite3');const db=new D(':memory:');const v=r('sqlite-vec');v.load(db);console.log('native+vec OK', db.prepare('select vec_version() as x').get().x);db.close()" $pkgRoot
